services:
  monitor-agent:
    build:
      context: ./monitor-agent
      dockerfile: Dockerfile
    container_name: defesa-monitor-agent
    restart: unless-stopped
    ports:
      - "8001:8001"
    networks:
      - defesa-ia-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  defesa-ia-net:
    driver: bridge
