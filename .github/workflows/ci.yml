name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 10)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore backend.sln

      - name: Build
        run: dotnet build backend.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test backend.sln --no-restore --configuration Release --logger "console;verbosity=minimal"

  frontend:
    name: Frontend (Vite + React)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend/defesa-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/defesa-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc -p tsconfig.app.json --noEmit

      - name: Build
        run: npm run build
