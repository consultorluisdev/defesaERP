services:
  postgres:
    image: postgres:17
    container_name: defesa-postgres
    restart: always
    environment:
      POSTGRES_DB: defesa_db
      POSTGRES_USER: defesa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina a variavel POSTGRES_PASSWORD no .env}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend/DefesaCivil.Api
      dockerfile: Dockerfile
    container_name: defesa-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=defesa_db;Username=defesa;Password=${POSTGRES_PASSWORD:?Defina a variavel POSTGRES_PASSWORD no .env}"
      Jwt__Key: ${JWT_KEY:?Defina a variavel JWT_KEY no .env}
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend/defesa-web
      dockerfile: Dockerfile
    container_name: defesa-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  defesa-ia:
    build:
      context: ./backend/DefesaIA-api/monitor-agent
      dockerfile: Dockerfile
    container_name: defesa-monitor-agent
    restart: unless-stopped
    ports:
      - "8001:8001"

  portainer:
    image: portainer/portainer-ce:latest
    container_name: defesa-portainer
    restart: always
    ports:
      - "9001:9000"
      - "9444:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  postgres_data:
  portainer_data:
