services:
  postgres:
    image: postgres:17
    container_name: defesa-postgres
    restart: always
    environment:
      POSTGRES_DB: defesa_db
      POSTGRES_USER: defesa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina a variavel POSTGRES_PASSWORD no .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5435}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend/DefesaCivil.Api
      dockerfile: Dockerfile
    container_name: defesa-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=defesa_db;Username=defesa;Password=${POSTGRES_PASSWORD:?Defina a variavel POSTGRES_PASSWORD no .env}"
      Jwt__Key: ${JWT_KEY:?Defina a variavel JWT_KEY no .env}
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000;http://127.0.0.1:3000}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/defesa-web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    container_name: defesa-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_started

  portainer:
    image: portainer/portainer-ce:latest
    container_name: defesa-portainer
    restart: always
    ports:
      - "127.0.0.1:9001:9000"
      - "127.0.0.1:9444:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  postgres_data:
  portainer_data:
