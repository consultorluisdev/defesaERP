services:
  postgres:
    image: postgres:17
    container_name: defesa-postgres
    restart: always
    environment:
      POSTGRES_DB: defesa_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${POSTGRES_PORT_DEV:-5436}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  backend:
    build:
      context: ./backend/DefesaCivil.Api
      dockerfile: Dockerfile
    container_name: defesa-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=defesa_db;Username=postgres;Password=${POSTGRES_PASSWORD:-postgres}"
      Jwt__Key: ${JWT_KEY:?Defina a variavel JWT_KEY no .env}
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000;http://127.0.0.1:3000}"
      Services__DefesaIAUrl: "${DEFESA_IA_URL:-http://defesa-ia:8000}"
    depends_on:
      postgres:
        condition: service_healthy
      defesa-ia:
        condition: service_started

  frontend:
    image: node:22-alpine
    container_name: defesa-frontend-dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "3000:5173"
    volumes:
      - ./frontend/defesa-web:/app
      - /app/node_modules
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
    depends_on:
      - backend

  defesa-ia:
    build:
      context: ./backend/DefesaIA-api
      dockerfile: Dockerfile
    container_name: defesa-ia
    restart: unless-stopped
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  portainer:
    image: portainer/portainer-ce:latest
    container_name: defesa-portainer
    restart: always
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data

volumes:
  postgres_data_dev:
  portainer_data:
